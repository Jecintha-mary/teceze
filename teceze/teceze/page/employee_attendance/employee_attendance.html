<div class="attendance-container">

    <!-- Header -->
    <div class="attendance-header">

        <div class="header-left">
            <h2>Employee Attendance</h2>
            <span id="status">
                <span class="status-badge status-none">
                    <span class="status-dot"></span>
                    Loading...
                </span>
            </span>
        </div>

        <div id="current-date" class="text-muted"></div>

    </div>

    <!-- Main Attendance Card -->

    <div class="card attendance-card">

        <!-- Top Section -->

        <div class="profile-section">

            <div class="profile-left">

                <div class="avatar" id="avatar_initial">
                    A
                </div>

                <div>
                    <h3 id="Employee_name">Loading...</h3>
                    <p id="Employee_location">Loading...</p>
                </div>

            </div>

            <div class="clock-box">
                <small>Working Timer</small>
                <h3 id="live-timer">00:00:00</h3>
            </div>

        </div>

        <div class="divider"></div>

        <!-- Attendance Details -->

        <div class="attendance-details">

            <div class="attendance-row">
                <span>Check In</span>
                <strong id="checkin_time">--</strong>
            </div>

            <div class="attendance-row">
                <span>Check Out</span>
                <strong id="checkout_time">--</strong>
            </div>

            <div class="attendance-row">
                <span>Working Hours</span>
                <strong id="working_hours">00:00:00</strong>
            </div>

        </div>

        <!-- Button -->

        <div class="button-area">
            <button class="btn" id="attendance_btn">Loading...</button>
        </div>

    </div>

    <!-- History Card -->

    <div class="card history-card">

        <div class="history-header">
            <h4>Recent Attendance</h4>
        </div>

        <table class="table attendance-table">

            <thead>
                <tr>
                    <th>Date</th>
                    <th>Check In</th>
                    <th>Check Out</th>
                    <th>Hours</th>
                </tr>
            </thead>

            <tbody id="attendance_history">
                <tr>
                    <td colspan="4" class="text-center">Loading...</td>
                </tr>
            </tbody>

        </table>

    </div>

</div>
