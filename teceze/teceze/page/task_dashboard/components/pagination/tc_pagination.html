{% if (total > 0) { %}
<nav class="tc-pager" aria-label="{%= aria %}">
    <span class="tc-muted">{%= info %}</span>
    <div class="tc-pager-right">
        {% if (sizes.length) { %}
        <label class="tc-pager-size">
            <span class="tc-muted">Rows per page</span>
            <select class="tc-page-size">
                {% for (var i = 0; i < sizes.length; i++) { var z = sizes[i]; %}
                <option value="{%= z.value %}" {%= z.selected %}>{%= z.value %}</option>
                {% } %}
            </select>
        </label>
        {% } %}
        <div class="tc-pager-nav">
            <button type="button" class="tc-page-btn" data-page="{%= prev %}" aria-label="Previous page" {%= prev_disabled %}>{%= prev_icon %}</button>
            {% for (var i = 0; i < items.length; i++) { var it = items[i]; %}
            {% if (it.gap) { %}
            <span class="tc-page-gap" aria-hidden="true">…</span>
            {% } else { %}
            <button type="button" class="tc-page-btn{%= it.cls %}" data-page="{%= it.page %}" {%= it.current %}>{%= it.page %}</button>
            {% } %}
            {% } %}
            <button type="button" class="tc-page-btn" data-page="{%= next %}" aria-label="Next page" {%= next_disabled %}>{%= next_icon %}</button>
        </div>
    </div>
</nav>
{% } %}
